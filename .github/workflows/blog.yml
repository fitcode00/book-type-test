name: blog
on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node blog/publish.js
        env:
          SECRETS: ${{ toJSON(secrets) }}
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add blog/published.json blog/out
          git diff --cached --quiet || (git commit -m "blog: update published state" && git push)
